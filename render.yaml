services:
  - type: web
    name: bus-reservation-system
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: bus-reservation-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bus-reservation-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: bus-reservation-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: bus-reservation-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bus-reservation-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@busbooker.com
      - key: ADMIN_PASSWORD
        value: AdminSecret@123

databases:
  - name: bus-reservation-db
    plan: free
    region: oregon
    databaseName: busdb
    user: bususer
