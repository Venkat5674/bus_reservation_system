<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Sign In - BusBooker</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="navbar-brand">
                <i class="fa-solid fa-bus-simple logo-icon"></i> BusBooker <span class="badge badge-primary" style="margin-left: 0.5rem;">Admin</span>
            </a>
            <div class="nav-links">
                <a href="/login" class="btn btn-secondary btn-sm"><i class="fa-solid fa-user"></i> Passenger Login</a>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div style="width: 56px; height: 56px; background: #eff6ff; color: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 0.8rem;">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>Staff & Admin Portal</h2>
                <p>Restricted access for fleet coordinators and system administrators.</p>
            </div>

            <div id="error-alert" style="display: none; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 0.8rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.9rem;"></div>

            <form onsubmit="handleLogin(event, 'ROLE_ADMIN')">
                <div class="form-group">
                    <label>Administrator Email</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" class="form-control" placeholder="admin@yourdomain.com" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Security Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; height: 48px; background: linear-gradient(135deg, #1e293b, #334155);">
                    <i class="fa-solid fa-key"></i> Authenticate as Admin
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-muted);">
                <i class="fa-solid fa-circle-info"></i> Default dev admin: <code>vpamudurti@gmail.com</code>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>

</html>
