<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings & E-Tickets - BusBooker</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body onload="checkAuth('ROLE_USER'); loadUserBookings();">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="navbar-brand">
                <i class="fa-solid fa-bus-simple logo-icon"></i> BusBooker
            </a>
            <div class="nav-links">
                <a href="/bus-search" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus"></i> Book New Bus</a>
                <button onclick="logout()" class="btn btn-danger-outline btn-sm"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Dashboard Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main);">My Dashboard</h1>
                <p style="color: var(--text-muted); font-size: 0.95rem;">Manage your active reservations, download e-tickets, and process instant cancellations.</p>
            </div>
            <div>
                <a href="/bus-search" class="btn btn-primary">
                    <i class="fa-solid fa-magnifying-glass"></i> Search Buses
                </a>
            </div>
        </div>

        <!-- Metric Stat Cards -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem;">
            <div style="background: white; padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 1.25rem;">
                <div style="width: 52px; height: 52px; border-radius: var(--radius-md); background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;">
                    <i class="fa-solid fa-ticket"></i>
                </div>
                <div>
                    <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Total Bookings</div>
                    <div style="font-size: 1.8rem; font-weight: 800; color: var(--text-main);" id="stat-total-trips">0</div>
                </div>
            </div>

            <div style="background: white; padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 1.25rem;">
                <div style="width: 52px; height: 52px; border-radius: var(--radius-md); background: #ecfdf5; color: #10b981; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div>
                    <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Confirmed Trips</div>
                    <div style="font-size: 1.8rem; font-weight: 800; color: #10b981;" id="stat-confirmed-trips">0</div>
                </div>
            </div>

            <div style="background: white; padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 1.25rem;">
                <div style="width: 52px; height: 52px; border-radius: var(--radius-md); background: #fef2f2; color: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;">
                    <i class="fa-solid fa-circle-xmark"></i>
                </div>
                <div>
                    <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Cancelled / Refunded</div>
                    <div style="font-size: 1.8rem; font-weight: 800; color: #ef4444;" id="stat-cancelled-trips">0</div>
                </div>
            </div>
        </div>

        <!-- Ticket Reservations Section -->
        <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main);">
                <i class="fa-solid fa-receipt" style="color: var(--primary);"></i> Your E-Tickets & Boarding Passes
            </h2>
            <button onclick="loadUserBookings()" class="btn btn-secondary btn-sm">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>

        <div id="booking-list">
            <!-- Dynamically populated by dashboard.js with airline/e-ticket boarding passes -->
        </div>
    </div>

    <!-- Toast Notification Element -->
    <div id="toast" class="toast"></div>

    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
</body>

</html>
