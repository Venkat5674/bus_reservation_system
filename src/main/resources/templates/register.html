<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Free Account - BusBooker</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="navbar-brand">
                <i class="fa-solid fa-bus-simple logo-icon"></i> BusBooker
            </a>
            <div class="nav-links">
                <a href="/login" class="btn btn-secondary btn-sm"><i class="fa-solid fa-user"></i> Sign In</a>
            </div>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div style="width: 56px; height: 56px; background: #ecfdf5; color: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 0.8rem;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2>Create Account</h2>
                <p>Join millions of travelers enjoying instant e-tickets and easy cancellation.</p>
            </div>

            <div id="error-alert" style="display: none; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; padding: 0.8rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.9rem;"></div>

            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Password (Min. 6 Characters)</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; height: 48px;">
                    <i class="fa-solid fa-user-check"></i> Register & Start Traveling
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--border-color); font-size: 0.92rem; color: var(--text-muted);">
                Already have an account? <a href="/login" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign In</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>

</html>
