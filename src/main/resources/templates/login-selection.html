<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Portal - BusBooker</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="navbar-brand">
                <i class="fa-solid fa-bus-simple logo-icon"></i> BusBooker
            </a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card" style="text-align: center;">
            <div style="width: 64px; height: 64px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1.25rem;">
                <i class="fa-solid fa-bus-simple"></i>
            </div>
            <h2>Welcome to BusBooker</h2>
            <p style="margin-bottom: 2rem;">Please choose your account portal to proceed:</p>

            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <a href="/login" class="btn btn-primary" style="height: 50px;">
                    <i class="fa-solid fa-user"></i> Passenger Login
                </a>
                <a href="/admin-login" class="btn btn-secondary" style="height: 50px;">
                    <i class="fa-solid fa-shield-halved"></i> Administrator & Fleet Login
                </a>
            </div>

            <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.95rem; color: var(--text-muted);">
                New to BusBooker? <a href="/register" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create an account</a>
            </div>
        </div>
    </div>
</body>

</html>
